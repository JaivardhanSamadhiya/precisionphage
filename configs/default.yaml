# PrecisionPhage v2 configuration. All knobs live here; modules contain no
# hard-coded paths or hyperparameters. Paths are relative to the repo root.

seed: 42
dataset_version: "2.0.0"

paths:
  root: ".."  # resolved relative to this configuration file
  vhi_csv: "data/raw/VirusHostInter.csv"
  # Frozen FASTAs used for the reported sequence-based analysis. These are
  # staged by accession/entity under external/phist_run for the reported run.
  # The large FASTAs are intentionally gitignored; compact resolution maps,
  # derived feature caches, and checksums are versioned with the project. See
  # DATA.md before attempting a refreshed download.
  phage_fasta_dir: "external/phist_run/phages"
  host_fasta_dir: "external/phist_run/hosts"
  raw_dir: "data/raw"
  interim_dir: "data/interim_v2"      # canonical cleaned artifacts
  results_dir: "data/results_v2"
  plots_dir: "data/plots_v2"
  cache_dir: "data/cache_v2"

data:
  # Only real experimentally-labeled studies are used for headline modeling.
  studies: ["NahantCollection", "NCBI_HR", "StaphStudy"]
  positive_tokens: ["inf", "infection", "1", "true", "infects", "yes", "positive"]
  negative_tokens: ["noinf", "no infection", "0", "false", "does not infect", "no", "negative"]
  # A pair enters the sequence-based model only if BOTH genomes resolve.
  require_both_genomes: true
  min_pos_per_group: 3      # for a group (species/genus) to be a valid eval fold
  min_neg_per_group: 3

features:
  kmer_k: 4                 # canonical 4-mers (CHERRY-proven)
  use_codon: true
  use_dinuc: true
  pca_phage_dim: 64         # fit INSIDE each training fold
  pca_host_dim: 64
  # Four genome-derived pair features are recomputed locally. The frozen VHIP
  # input additionally supplies k3dist, k6dist, GCdiff, and Homology; see DATA.md.
  edge_features: ["kmer_dist", "gc_diff", "onf_corr", "homology"]
  n_workers: 8
  homology_ks: [16, 20]     # multi-scale exact word sizes (sensitive + specific)
  crispr_repeat_k: 23       # CRISPR repeat-anchor k-mer size
  crispr_match_k: 20        # word size for matching spacers to the phage
  use_protein_features: true   # tblastx-style protein homology (6-frame ORFs)
  protein_k: 7              # amino-acid word size
  protein_min_pep: 90       # min ORF length (aa) to suppress spurious 6-frame ORFs
  use_seq_pair_features: true  # include homology+CRISPR pair features if cached

splits:
  mash_k: 21                   # k-mer size for the in-house bottom-k sketch
  minhash_num: 256             # bottom-k sketch size
  mash_max_distance: 0.05      # Mash-form distance cutoff; not an ANI estimate
  n_combined_splits: 5         # blocks for combined unseen-phage+host CV
  regimes: ["loso", "logo", "phage_cluster", "host_cluster", "combined", "cross_study"]

model:
  encoder: "sage"           # inductive GraphSAGE
  hidden_dim: 128
  embed_dim: 64
  n_layers: 2
  dropout: 0.3
  edge_mlp_hidden: 128
  lr: 0.001
  weight_decay: 0.00005
  epochs: 300
  patience: 25
  val_frac: 0.15

compute:
  n_jobs: 10                # max parallel worker processes for CV folds
  threads_per_job: 1        # BLAS/torch threads per worker (n_jobs*this <= cores)

eval:
  bootstrap_n: 10000
  bootstrap_ci: 0.95
  calibration_bins: 10
  permutation_n: 1000

cocktail:
  prob_threshold: 0.5       # fallback; reported run uses nested fold thresholds
  max_size: 5
  solver: "greedy"          # or "ilp"

temporal:
  mutation_rate: 1.0e-7
  resistance_cost: 0.05
  burst_size: 50
  adsorption_rate: 1.0e-9
  horizon_hours: 96
  dt_hours: 0.5
  # This deterministic sensitivity analysis assumes independent resistance
  # across targeting phages. It is illustrative, not an experimentally fitted
  # cross-resistance model.

fetch:
  ncbi_email: "jsamadhi@mywvm.wvm.edu"  # NCBI Entrez contact for reproducible fetches
